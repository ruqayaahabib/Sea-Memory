<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Memory</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>
    <main id="game">
        <h1>Sea Memory</h1>

        <div id="score">
            <h3>Score </h3>
        </div>

        <p id="message">Watch the sequence</p>

        <div id="game-choice">
            <button class="animal" id="turtle">
                <img src="images/turtle.png" alt="">
            </button>

            <button class="animal" id="fish">
                <img src="images/fish.png" alt="">
            </button>

            <button class="animal" id="octopus">
                <img src="images/octopus.png" alt="">
            </button>

            <button class="animal" id="jellyfish">
                <img src="images/jellyfish.png" alt="">
            </button>

        </div>
    </main>
</body>
</html>
